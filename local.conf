# Local, project-specific overrides. This file is ignored by git.
# Example: use a project-local xPack toolchain installed under ./xpacks.
# Fallback to global xPack install if local bin does not exist.

XPACKS_BIN := $(abspath xpacks/.bin)
GLOBAL_XPACKS_BIN := $(HOME)/Library/xPacks/@xpack-dev-tools/riscv-none-elf-gcc/11.3.0-1.1/.content/bin
export PATH := $(GLOBAL_XPACKS_BIN):$(XPACKS_BIN):$(PATH)
TOOLPREFIX := $(GLOBAL_XPACKS_BIN)/riscv-none-elf-
CFLAGS_EXTRA := -march=rv64g -mabi=lp64
ASFLAGS_EXTRA := -march=rv64g -mabi=lp64
LDFLAGS_EXTRA := -m elf64lriscv
